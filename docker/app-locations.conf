root /usr/share/nginx/html;
index index.html;

# Kept outside the redirect so container healthchecks work in TLS mode too.
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Hashed filenames — safe to cache forever. Anything stale is a different URL.
location /assets/ {
    include /etc/nginx/msec/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The service worker and the shell must never be cached, or a pulled image
# would keep serving the previous build until the browser felt like checking.
location = /sw.js {
    include /etc/nginx/msec/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
}

location = /index.html {
    include /etc/nginx/msec/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location = /manifest.json {
    include /etc/nginx/msec/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# SPA fallback: deep links resolve to the shell and React routes from there.
location / {
    include /etc/nginx/msec/security-headers.conf;
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
