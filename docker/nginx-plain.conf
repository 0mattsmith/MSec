# MSEC_TLS=off — plain HTTP, for people terminating TLS at their own reverse
# proxy (Caddy, Nginx Proxy Manager, Traefik, Tailscale Serve).
#
# Reaching this directly over http:// on a LAN hostname leaves the browser
# outside a secure context, where crypto.subtle does not exist and MSec cannot
# unlock. Only use this mode behind something that speaks HTTPS.
server {
    listen 8080;
    server_name _;

    # Trust the proxy's scheme so the app is not told it is insecure.
    absolute_redirect off;

    include /etc/nginx/msec/app-locations.conf;
}
