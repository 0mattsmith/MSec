# MSEC_TLS=auto — HTTPS with the certificate in /certs (generated on first boot
# unless you mounted your own).

server {
    listen 8080;
    server_name _;

    # Healthcheck stays on plain HTTP so it doesn't have to trust the cert.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 308 https://$host:__HTTPS_PORT__$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/msec.crt;
    ssl_certificate_key /certs/msec.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:MSecSSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/msec/app-locations.conf;
}
