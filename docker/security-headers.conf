# Included in every location that sets a header of its own — nginx's add_header
# inheritance is replace-not-merge, so a location with its own add_header would
# silently drop everything set at server level.

# A password manager should never be framed, sniffed, or leak its URL onward.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# camera: QR-code scanning for TOTP import.
# publickey-credentials-get/create: WebAuthn biometric unlock.
# Everything else is switched off.
add_header Permissions-Policy "camera=(self), publickey-credentials-get=(self), publickey-credentials-create=(self), geolocation=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

include /etc/nginx/msec/csp.conf;
