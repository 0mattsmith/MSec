[package]
name = "msec"
version = "0.1.19"
description = "Secure, all-in-one password manager and authenticator"
edition = "2021"

[lib]
name = "msec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-upload = "2"
# Catches the Google OAuth redirect on Android (custom URI scheme). Supported
# on desktop too, so no target gating is needed.
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Self-updating is desktop-only: Android and iOS cannot install their own
# packages without the OS asking the user first.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
