# Builds a debug APK via Tauri's Android support and — when triggered by a
# version tag — attaches it to that tag's GitHub Release so it can be
# downloaded straight onto a phone. Debug-signed: fine for sideloading,
# not for Play Store. A signed release APK/AAB needs a keystore later.
name: Build Android APK (debug)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icons/icon-1024.png

      - name: Initialize Android project
        run: npx tauri android init
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - name: Build debug APK
        run: npx tauri android build --debug --apk
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125

      - uses: actions/upload-artifact@v4
        with:
          name: msec-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      # Give the APK a predictable, version-stamped filename.
      - name: Collect APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p release
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          cp "$APK" "release/MSec-${{ github.ref_name }}-android-debug.apk"
          ls -la release/

      # Attach to the same (draft) release the desktop workflow creates.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "MSec ${{ github.ref_name }}"
          draft: true
          files: release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
