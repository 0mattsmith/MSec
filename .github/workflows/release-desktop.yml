# Builds installers for Windows (.msi/.exe), macOS Universal (.dmg/.app),
# and Linux (.deb/.rpm/.AppImage) whenever you push a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# Creates a draft GitHub Release with all binaries attached.
name: Release Desktop Apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - run: npm ci

      - name: Generate Tauri icons
        run: npx tauri icon public/icons/icon-1024.png

      # createUpdaterArtifacts makes the bundler sign every installer and emit
      # latest.json. It hard-fails when no signing key is present, so it is
      # switched on only when the secret actually exists - a missing secret
      # should degrade to "no self-update", not "no release".
      - name: Enable signed update artifacts when a key is available
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            node -e "const fs=require('fs'),f='src-tauri/tauri.conf.json',c=JSON.parse(fs.readFileSync(f,'utf8'));c.bundle.createUpdaterArtifacts=true;fs.writeFileSync(f,JSON.stringify(c,null,2));"
            echo "Signing key present - updater artifacts enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set. Installers will build, but no signed update artifacts or latest.json will be produced, so in-app desktop updates stay disabled."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs each installer and emits latest.json, which installed copies
          # verify against the public key baked into the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MSec ${{ github.ref_name }}"
          releaseBody: "See the attached installers for Windows, macOS (Universal), and Linux."
          # Published immediately so the in-app updater can see it.
          releaseDraft: false
          includeUpdaterJson: true
          prerelease: false
          args: ${{ matrix.args }}
